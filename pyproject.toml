[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muybridge"
version = "0.0.0"
description = "Morphology-robust humanoid locomotion for Unitree G1 in MJX"
requires-python = ">=3.11"
dependencies = [
  "playground==0.2.0",
  "mujoco==3.13.0",
  "mujoco-mjx==3.13.0",
  "jax==0.10.2",
  "brax==0.14.2",
  "viser==1.1.0",
  "tensorboard>=2.21",
]

[tool.setuptools.packages.find]
include = ["muybridge*"]
